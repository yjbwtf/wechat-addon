# ==========================================================================
#  config.example.yaml  —— 复制成 config.yaml 再改
#  ------------------------------------------------------------------------
#  为什么仓库里放的是 example 而不是真配置：
#  config.yaml 里有**口令、授权名单（微信号）、白名单群名**，
#  这些不该进版本库。首次运行时 start.cmd 会提示你复制一份。
#
#  必须改的至少三处（下面的占位符 <...>）：
#    1. whitelist_groups —— 你的群名，必须和微信里显示的完全一致
#    2. commands.allowed_senders —— 谁有权发控制指令，强烈建议填微信号
#    3. commands.secret —— 口令，别用群名或常见词
# ==========================================================================

# ==========================================================================
#  微信群助手 —— 主配置
#  改完本文件需要重启机器人；改 persona.yaml 不需要重启。
# ==========================================================================

dsh:
  # DSH 启动器（dsh.cmd）—— **必须改成你自己的**。
  # 装好 DSH 桌面版后，在命令行里跑 `where dsh` 找它的路径，例如：
  #     command: "C:\\Users\\你的用户名\\.dsh\\bin\\dsh.cmd"
  # 如果 dsh 已经在 PATH 里，直接留 "dsh" 也行。
  # （原来这里写死的是一条开发机上的路径，新用户照抄必然报
  #   「找不到 dsh 启动器」—— 打包验包时踩到的。）
  command: "dsh"
  # 专用 profile（已内置人设约束与工具白名单）
  profile: wechat
  # 单次思考超时（秒）
  timeout_seconds: 180
  # 主模型超过这么久还没吐字，就换兜底档再问一次（0 = 不换）。
  # 免费档被挤爆时不会一句不回地干等 —— 慢一点答也比石沉大海好。
  fallback_after_seconds: 45
  # 换到哪个档（deepseek / zhipu）。留空 = 自动退回 deepseek。
  fallback_preset: ''
  # 闲聊用哪个模型（手动切换，机器人不替你做判断）：
  #   deepseek = profile 里配的（DSH 桌面账号，按量计费）
  #   zhipu    = 智谱 GLM-4.7-Flash（官方定价输入/输出都是「免费」）
  # 改完立刻生效，不用重启机器人。\agent 指令不受影响。
  model_preset: deepseek
  # 智谱的 API Key，只在 model_preset: zhipu 时用得到。
  # 申请：https://bigmodel.cn/usercenter/proj-mgmt/apikeys
  # 不用实名认证。本文件（config.yaml）是 gitignore 的；dsh\model-zhipu.yml
  # 里只写变量名不写密钥，所以密钥不会进仓库。
  zhipu_api_key: ''
  # 叠加层放哪，留空 = <项目>\dsh\model-zhipu.yml
  preset_dir: ''

# draft = 只生成草稿，不发送到群里（强烈建议先用这个跑一两周）
# auto  = 生成后直接发送
mode: auto

# --------------------------------------------------------------------------
# 安全边界一：白名单群
# 机器人【只】在这些群里工作。群名必须和微信里显示的完全一致。
# 留空 = 任何群都不工作（防止误触发）。
# --------------------------------------------------------------------------
whitelist_groups:
  - "<你的群名>"

# 机器人在群里的昵称，用于识别 @

bot_names:
  - "蓝色大肥鱼"
require_at: true          # true = 只有被 @ 才回复
ignore_self: true         # 忽略自己发出的消息

# --------------------------------------------------------------------------
# 安全边界二：频率限制（降低风控与被举报概率）
# --------------------------------------------------------------------------
rate_limit:
  per_group_per_hour: 20      # 每群每小时最多回复条数，超出直接静默丢弃
  min_interval_seconds: 8     # 同一群两条回复之间的最小间隔
  reply_delay_min: 3          # 回复前的随机延迟下限（秒），模拟真人节奏
  reply_delay_max: 6          # 回复前的随机延迟上限（秒）

# --------------------------------------------------------------------------
# 连续消息聚合：被 @ 之后先别急着回，听人把话说完
#
# 群里常见的节奏是「@机器人」发一条，再把真正的问题分几条补上。
# 如果收到第一条就抢答，机器人会在你还没打完字的时候冒出一句
# 「在呢在呢」，非常像机器人。
#
# 开启后：被 @ 的那条不立刻回复，而是继续观察这个群；
# 静默 quiet_seconds 秒内没有新消息，就把这几条当成【同一次发言】
# 整体理解，只回一条。
# --------------------------------------------------------------------------
aggregate:
  enabled: true
  quiet_seconds: 6          # 最后一条消息之后安静多少秒算「说完了」
  max_wait_seconds: 25      # 从第一句算起最长等多久（对方一直发也会回）
  max_messages: 8           # 一次最多攒几条；攒满立刻回，不等静默
  # 观察期间谁的话算「同一段发言」：
  #   any  = 群里任何人说的都纳入（更像真人在听整段对话）
  #   same = 只有发起 @ 的那个人说的才纳入（更保守，推荐熟人群用 any）
  followup_sender: any

  # 回复完之后，多长时间内「接着聊」可以不再 @。
  # 不加这个的话，被 @ 一次之后对方再补一句（「nmsl」「那咋了」）就完全没反应，
  # 看起来像死机。0 = 关掉，每句都必须 @。
  after_reply_window: 120
  # 这个窗口里谁的话算接着聊：
  #   same = 只有刚才触发 @ 的那个人（推荐，19 人群里不会变成复读机）
  #   any  = 谁都算
  after_reply_sender: same

# --------------------------------------------------------------------------
# 分段发送：长回复拆成几条发（微信群里没人会发一整屏文字）
#
# 注意：拆出来的每一条都算一次「每群每小时上限」。这是有意的——
# 上限卡的就是**实际发出的消息条数**，口径和群友看到的观感一致。
# --------------------------------------------------------------------------
split:
  enabled: true
  min_chars: 50         # 短于这个长度不拆
  max_chars: 60         # 想控制在每条多少字以内（用它算该拆几段，再按均值匀）
  max_parts: 3          # 最多拆几条，多出来的并进最后一条
  min_part: 6           # 比这更短的碎片并回上一段，避免刷屏
  delay: [1.5, 4.0]     # 段与段之间的随机间隔（秒）

# --------------------------------------------------------------------------
# 梗词库：让机器人认得出网络热梗，并且接得住
#
# 命中才注入，没命中一个 token 都不花。
# 词库在 memes.yaml；群里现教的写进 data/memes_user.yaml（优先级更高）。
# 在群里教新梗（需要授权昵称）：
#     \\梗 add ccb | 踩踩背那个梗，顺着演别解释
#     \\梗 del ccb
#     \\梗 list
# --------------------------------------------------------------------------
memes:
  enabled: true
  file: memes.yaml
  max_entries: 6        # 一次最多注入几个梗
  max_chars: 420        # 注入内容的字数上限
  scan_history: true    # 除了当前消息，也扫最近聊天记录
  history_window: 8     # 只扫最近这几条。扫全部会导致每轮都命中同一个词、白花 token
  max_history_hits: 2   # 历史里命中的最多注入几个（当前消息里的优先，不受此限）

# --------------------------------------------------------------------------
# 梗词库的定时联网更新
#
# 梗活得短，手工维护必然烂掉。开启后机器人会定期用带联网搜索的 profile
# 去网上捞最近流行的梗，写进 data\memes_user.yaml。
#
# **不会碰 memes.yaml** —— 那份是给人看、给人改的内置库，注释和排版有意义，
# 程序回写会毁掉它们。捞到的写进叠加层，叠加层优先于内置库，
# 用群里的 \梗 del 一样能删。
#
# 一次调用成本约等于查一次天气，默认 14 天一次。
# --------------------------------------------------------------------------
memes_update:
  enabled: true
  interval_days: 14     # 多久捞一次
  max_new: 20           # 一次最多收几条，防灌爆提示词
  check_minutes: 120    # 运行时多久检查一次该不该捞

# --------------------------------------------------------------------------
# 连续对话：被 @ 一次之后，那个人接着说话不用再 @
#
# 按 (群, 人) 分开维护线程——两个人同时跟你说话时不会串。
# 「算不算接着聊」的判定是纯启发式的（字符二元组 + 是不是对别人说的），
# **不额外调用模型**，判定成本是零。拿不准的一律不接。
#
# 群里的「引用」（右键消息 -> 引用）是最明确的路标：
#   引用机器人的消息  -> 一定是在跟机器人说，窗口过期也重新接上
#   引用别人的消息    -> 一定不是在跟机器人说，直接关掉这个人的线程
# --------------------------------------------------------------------------
threads:
  enabled: true
  window_seconds: 600     # 多久没说话算这个话题结束
  max_turns: 6            # 一个人最多连续聊几轮就收住，免得刷屏
  long_chars: 40          # 超过这么多字又和上文零重合，判为在跟别人说
  merge_window: 25        # 这么多秒内别人的话若话题相关，并到同一次回答
  # 群里最后一条消息是机器人说的 -> 下一个开口的人几乎一定是在跟它说话。
  # 这条救的是「机器人说完、群里安静十几分钟、然后有人冒一句」的情况——
  # 实测踩过：没有线程、没有 @，那句「干嘛的不回话」被直接丢掉了。
  answer_when_last: true
  dangling_window: 900    # 上面那条规则的时限（秒）
  persist: true           # 线程存 data\threads.json，重启不丢

# --------------------------------------------------------------------------
# 心情值 / 好感度：按人记，影响之后的语气
#
# 数值变化**不额外调用模型**：在同一次回复的末尾附一行 [mood:-6] 就行，
# 程序解析出来、从正文删掉、落到库里。代价只有几个输出 token。
# 范围 1~100，默认 100（一视同仁地友好）；被冒犯了往下掉，聊得开心可以回升。
# 群内 \\status 会列出当前心情偏低的人。
# --------------------------------------------------------------------------
mood:
  enabled: true
  initial: 100
  floor: 1
  ceiling: 100
  max_down: 15            # 单次最多掉多少，防止一句话把好感打到底
  max_up: 8
  neutral: 70             # 高于这个值不额外注入语气说明（省 token）
  angry: 35               # 低于这个值时明显变冷
  show_in_status: true    # \\状态 里是否列出偏低的人

# --------------------------------------------------------------------------
# 开机补回：机器人停机期间错过的 @ 消息，启动后补答
# --------------------------------------------------------------------------
catch_up:
  enabled: true
  lookback_messages: 20   # 只看窗口最后 N 条，不翻旧账
  max_per_group: 3        # 每次启动每群最多补 3 条，防止开机刷屏

# --------------------------------------------------------------------------
# 群内 \agent 指令：把一条自然语言指令交给本机 agent 执行
#
# ⚠⚠ 这是整个项目里权限最大的一条指令 ⚠⚠
# 走的是 wechat-agent 这个 DSH profile，fs / pwsh / fs-search 全开，
# 也就是「能在群里发这条指令的人，等于能在这台机器上读文件、改文件、跑命令」，
# 中间没有任何隔离层。
#
# 为什么默认关掉：群昵称谁都能改成授权昵称，allowed_senders 那层挡不住冒用；
# commands.secret 是唯一的第二因素，而它在群里发过就等于公开。
# 所以这个功能只适合「群成员都是自己人」的场景。
#
# 开启步骤：
#   1. commands.secret 设一个口令（不能留空，留空会被拒绝启用）
#   2. agent.enabled: true
#   3. 强烈建议同时用 agent.groups 限定只在某一个群生效
# 用法：  \agent 把 README 第三节的标题改成 XXX
#         \agent log          看最近几次调用记录
# 每次调用都写 data\agent_audit.jsonl，事后能查出谁让机器干了什么。
# --------------------------------------------------------------------------
agent:
  enabled: false               # 默认关闭。想清楚再开
  profile: wechat-agent       # 有完整工具链的 DSH profile
  words: [agent, 执行, run, 操作]
  require_secret: true        # 强制口令。关掉 = 把机器交给整个群
  groups: []                  # 只在这些群生效；留空 = 全部白名单群
  hours: []                   # 允许的时段 [起, 止)，如 [8, 23]；留空 = 不限
  timeout_seconds: 600
  max_reply_chars: 1200       # 结果太长就截断，群里没人看长报告
  cwd: ''                     # 留空 = 项目目录 C:\wechat_addon
  ack: true                   # 先回一句「收到，开始弄」
  audit_file: data/agent_audit.jsonl

# --------------------------------------------------------------------------
# 群内 \截图 指令：抓一张当前屏幕发出去
#
# ⚠ 截图拍的是**整块屏幕**，包括当时开着的任何窗口。
# 发到 19 人的群里 = 全群都看得到你屏幕上有什么。
# 想只给自己看就把 target 改成 private 并填 private_to。
# --------------------------------------------------------------------------
screenshot:
  enabled: true
  words: [截图, 截屏, screen]
  target: same                # same = 发回指令所在的聊天；private = 私聊发给 private_to
  private_to: ''              # target=private 时的收件人（微信里显示的昵称）
  max_width: 0                # 0 = 原分辨率发送（不缩放）；填数字就缩到那个宽度
  format: PNG                 # PNG | JPG
  quality: 82                 # format=JPG 时的质量
  keep_files: 20              # 本地最多留几张截图
  require_secret: false       # 要不要口令
  timeout_seconds: 30

# --------------------------------------------------------------------------
# 群内指令：消息里出现 prefix 即为指令，只有 allowed_senders 里的人有效
#
# 注意 prefix 的写法：单引号里的 \\ 就是两个反斜杠（YAML 单引号不做转义）
# 安全提醒：身份只能靠群昵称判断，而群昵称群成员自己能改，防不了冒用。
# --------------------------------------------------------------------------
commands:
  enabled: true
  # 群里指令的开头。**单个反斜杠**（\截图、\agent 任务）。
  # YAML 单引号里不转义：'\' 就是那一个；写成 "\\" 才是两个。
  prefix: '\'

  # 授权名单。微信里同一个人有好几个名字，可靠程度差很多：
  #
  #   群昵称          全群可见，成员自己能改       最弱
  #   备注            只有机器人账号自己看得到     中   <- 别人不知道字符串是什么
  #   微信昵称        全群可见，自己能改           弱
  #   微信号 id       群里基本看不到，改不了       最强
  #
  # 所以「备注当密钥」这个思路是对的：机器人账号给「大号」设的备注，
  # 群成员根本不知道字符串是什么，比群昵称强得多。
  # 但要清楚它的弱点：**冒用者只要把自己的群昵称改成同一个字符串，
  # 微信里显示出来的发送者就会等于那个串**。真正防冒用要靠微信号，
  # 也就是下面的 identity_mode: id。
  allowed_senders:
    - "<你的微信号>"    # 强烈建议填这个：改不了、群里看不到，防冒用
    - "<你在微信里的备注>"   # 急停/恢复降级匹配时用（见下）
    # - "<群昵称>"      # 最弱，成员自己能改，不建议

  # any = 任何别名对上就放行（宽松，方便但防不了冒用）
  # id  = 只认微信号，且必须真的读到才放行（严格，推荐）
  #
  # 注意：无论哪种模式，「急停/恢复」都有一条安全阀 —— 严格模式读不到
  # 微信号时会降级成宽松匹配放行，并在日志里留 warning。
  # 否则一旦 sender_info() 抽风，主人就被自己的严格模式锁在门外，
  # 机器人既停不下来也起不来，比被人冒用严重得多。
  # 要让这条安全阀真正兜得住，名单里就得**同时**写上微信号和备注。
  identity_mode: any
  verify_identity: true

  # 口令。填上之后指令正文里必须包含它。
  # 注意：在群里发过的口令等于公开 —— 群消息所有成员都看得到。
  short_prefix: '/'

  # 可信会话：这些会话里的消息**不用 @**、指令**不用口令**，也不走线程判断。
  #
  # ⚠️ **只填你自己的私聊。** 私聊的发送者没法冒充，所以免口令是安全的。
  # 千万别填群名：identity_mode=any 时群昵称谁都能改，
  # 群里免口令 = 把机器人的完整控制权交给任何知道你代号的人。
  #
  # 在私聊里就可以直接发：/agent 看看 README 有多少行

  trusted_chats:
    - "<你的私聊会话名>"

  # 授权名单。微信里同一个人有好几个名字，可靠程度差很多：
  #
  #   群昵称          全群可见，成员自己能改       最弱
  #   备注            只有机器人账号自己看得到     中   <- 别人不知道字符串是什么
  #   微信昵称        全群可见，自己能改           弱
  #   微信号 id       群里基本看不到，改不了       最强
  #
  # 所以「备注当密钥」这个思路是对的：机器人账号给「大号」设的备注，
  # 群成员根本不知道字符串是什么，比群昵称强得多。
  # 但要清楚它的弱点：**冒用者只要把自己的群昵称改成同一个字符串，
  # 微信里显示出来的发送者就会等于那个串**。真正防冒用要靠微信号，
  # 也就是下面的 identity_mode: id。

  restart:
    - "restart"
    - "重启"
    - "重开"

  secret: ""            # 示例留空 = 不校验口令。**务必填一个**，别用群名或常见词
  stop:
    - "stop"
    - "停止"
    - "停"
    - "暂停"
  start:
    - "start"
    - "恢复"
    - "启动"
    - "继续"
  status:
    - "status"
    - "状态"
  meme:
    - "梗"
    - "meme"
    - "gag"
  reply_confirm: true     # 执行后在群里回一句确认（想低调可改 false）

# --------------------------------------------------------------------------
# 聊天记录：读取上限 + 滚动保留 + 到期自动清理
# --------------------------------------------------------------------------
history:
  enabled: true          #历史记录开关
  retention: weekly      # daily | weekly | forever
  retention_days: 7      # retention=weekly 时生效；daily 固定 1 天
  per_group_max: 500     # 每群最多保存条数，超出按时间淘汰最旧
  purge_interval_min: 30 # 过期清理任务运行间隔（分钟）
  reset_on_expiry: true  # 窗口结束后清空该群历史，重新开始记录

  # 组装上下文时最多读取多少（独立于上面的存储上限）
  read_limit:
    max_messages: 30
    max_chars: 6000
    max_age_days: 3

  # 历史里每条消息最多保留多少字。超长的（比如有人贴了一大段）会截断——
  # 一次查天气要跑 3 步 agent 循环，每步都重发这份上下文，代价是 3 倍。
  per_message_chars: 120

# 同一条消息在多少秒内只处理一次（防止 UIA 重复读取导致刷屏）
dedup:
  window_seconds: 300

logging:
  level: INFO
  dir: data/logs


# --------------------------------------------------------------------------
# 梗词库的定时联网更新
#
# 梗活得短，手工维护必然烂掉。开启后机器人会定期用带联网搜索的 profile
# 去网上捞最近流行的梗，写进 data\memes_user.yaml。
#
# **不会碰 memes.yaml** —— 那份是给人看、给人改的内置库，注释和排版有意义，
# 程序回写会毁掉它们。捞到的写进叠加层，叠加层优先于内置库，
# 用群里的 \梗 del 一样能删。
#
# 一次调用成本约等于查一次天气，默认 14 天一次。
# --------------------------------------------------------------------------
# --------------------------------------------------------------------------
# \开 <程序>：远程启动需要管理员权限的程序
#
# 走预授权提权通道，**不过 LLM** —— 一条指令直达，几秒返回，不花 token。
# 比「\agent 帮我开原神」快得多，也不会因为要管理员权限而卡住。
#
#   群里发：\开 原神 ccb
#   不带程序名就回一条可用列表
#
# 程序名必须写在 tools\elevated\run.ps1 的 $programs 表里（路径写死在那，
# 调用方只能选名字、不能传路径）。加程序 = 改那份脚本 + 重跑 setup_elevated.ps1。
# --------------------------------------------------------------------------
# --------------------------------------------------------------------------
# 轮询节奏
#
# 机器人不是每轮都读所有群：只在「微信报告该群有未读」时才读，否则跳过，
# 等下一次全量扫描。这是为了少抢微信窗口（每次读都要切换会话）。
#
# 代价是**漏读窗口**：full_scan_every 轮才全量读一次，默认 6 轮 ≈ 18 秒，
# 再叠加全量扫描本身的耗时。
#
# 如果发现「消息在眼皮底下却漏了」：先把这里调成 1（每轮全读，不会漏），
# 代价是每 3 秒抢一次微信焦点。定位完再调回去。
# --------------------------------------------------------------------------
# --------------------------------------------------------------------------
# 日志的定期清理
#
# 日志会一直涨（bot.log 每次重启都追加），加上控制台输出、审计日志，
# data\ 几个月就能到几百 MB。按时间删：超过 keep_days 天的 *.log 清掉。
#
# 不做轮转（rotate）—— 这个项目不需要留历史日志，只需要能查最近的问题。
# 正在写的那个文件删不掉，会被跳过，下次再试（正常情况，不是故障）。
# --------------------------------------------------------------------------
logs:
  cleanup_enabled: true
  keep_days: 14         # 超过这么多天的 *.log 删掉。0 = 不删
  check_hours: 6        # 多久检查一次


poll:
  # 每几轮做一次全量读取（1 = 每轮都读所有群，不会漏消息，但每 3 秒抢一次微信焦点）
  full_scan_every: 6

  # 每次读取前用 LoadMoreCache 多加载几次历史。
  # **这是根治性的**：微信窗口默认只装最近十几条，而机器人自己发的截图
  # 也占位置 —— 实测用户连发 4 条只收到 1 条回复，因为前几条被自己发的
  # 截图挤出了窗口。装载更多，这个自我竞争才不存在。
  # 代价：每次读取更慢、微信会话会上滚。漏消息就调大。
  load_more_times: 2


launch:
  enabled: true
  words: ["开", "打开", "开个", "开一下", "帮我开", "launch", "open"]

# \刷课 <课程>：用你自己的浏览器打开课程页。
# **不走 AI** —— 打开对的页面就够了，剩下的交给油猴脚本。
#   \刷课            列出配好的课程
#   \刷课 舞台        按名字打开（Substring 匹配）
#   \刷课 https://…   直接打开一个网址
# 为什么不让 agent 干这件事：它起的浏览器会在指令结束时被回收，为了绕开
# 这一点它还会去杀你正在用的浏览器（真发生过，见 README）。
brush:
  enabled: true
  words: ["刷课", "上课", "挂课"]
  browser: ''          # 留空 = 用系统默认浏览器
  # 课程表。**在设置界面「权限」页里填更方便**：一行一门课，两个输入框
  # （课程名 / 网址）+「＋ 添加一行」，空行会自动消失。
  # 这里两种写法都认：`名字 | 网址` 或 {name:…, url:…}。
  courses: []
  #   - 舞台人生 | https://mooc2-ans.chaoxing.com/mooc2-ans/mycourse/studentcourse?courseid=...

# 账号查询：查米哈游账号的公开角色展柜（Enka.Network）。
# **不走 AI** —— 一次 HTTP + 一段固定文字，秒回、零 token。
#
#   群友用（公开指令，不要口令、不看授权名单）：
#     @机器人 /查询 原神 618285856
#     @机器人 /查询 618285856          游戏名可省略，自动认
#   授权者用（控制指令，要口令）：
#     \uid 618285856 / \uid hsr 618285856 / \uid
#
# 前缀 `/` 是**刻意**和群控制指令的 `\` 分开的：`\` 开头一律要口令，
# 而群友不知道口令。公开指令必须 @、只认白名单群、暂停时不回复。
# 看不到背包、原石、抽卡记录 —— Enka 只能拿到游戏里「展柜」公开的那部分。
# 作者定的规矩（别改坏）：不许枚举 UID、必须带自定义 UA、要有间隔和上限、
# ttl 期间走本地缓存。这些在 src/enka.py 里实现。
enka:
  enabled: true
  allow_group_members: true    # 群友能不能用 @机器人 /查询
  prefix: '/'
  words: ["查询", "uid", "查询uid", "战绩"]
  default_uid: ''        # 不带参数时查这个 UID
  default_game: auto     # auto = 自动识别；也可填 gi / hsr / zzz
  timeout_seconds: 20
  min_interval_seconds: 3
  max_per_hour: 60
  # 点名查角色时发**面板图**而不是文字（排版照 miao-plugin，评分跑它的代码）。
  # 需要本地有面板模块（不进版本库）；没有或渲不出来时自动退回发文字。
  image: true

  # 圣遗物评分：莫娜占卜铺的「有效词条」（wormtql/genshin_artifact）。
  # 「以单次强化最大档位为 1 分」：每条副词条 数值 / 满档值 × 权重 求和。
  # 满档值（5★）：暴击率 3.9% / 爆伤 7.8% / 攻击% 5.8% / 精通 23 / 充能 6.5%。
  # 默认权重和莫娜一致：暴击率 1、暴击伤害 1、攻击力% 1，其余 0。
  # 只统计副词条（主词条不算，莫娜也是）；没满级的给的是当前分，会标 *。
  score:
    enabled: true
    stats: ["暴击率", "暴击伤害", "攻击力%"]
    by_character: []
    #   - 胡桃 | 暴击率 暴击伤害 生命值% 0.8

# --------------------------------------------------------------------------
# 鸣潮账号查询：\鸣潮 …（群里也可以用公开写法 @机器人 /鸣潮 …）
#
# **每个人各自登录、各查各的** —— 账号按发送者的**微信号**归属：
#
#     群里 @机器人 /鸣潮 登录 13800138000     <- 先给手机号
#     （机器人 **@ 他**，让他去库街区 App 点「获取验证码」）
#     群里 @机器人 /鸣潮 验证码 123456        <- 把码交回来
#     群里 @机器人 /鸣潮 维里奈               <- 查他自己那个号
#
# 多个账号存在平台自己的凭据库里（一个文件，各归各的 key）。
# **谁也不能查别人的**：想登别人的号得先拿到别人手机的验证码。
#
# 数据来自 wuthering-waves-platform 的 MCP 服务（需要 Node.js 22+）：
#   https://github.com/yangfeng20/wuthering-waves-platform
#
# 注意：库街区的 Token 和 did 是绑定的。别在库街区 App、别的插件和这里
# 反复登录同一个账号 —— 后登录的会让先前的会话失效。
# --------------------------------------------------------------------------
wuwa:
  enabled: true
  words: ["鸣潮", "wuwa", "waves"]
  # 群友能不能用公开写法。**每个人只能碰自己那个账号**，所以开着是安全的。
  allow_group_members: true
  # 拿不到微信号时允不允许退回用群昵称当钥匙。**默认不允许** ——
  # 群昵称谁都能改，允许的话 A 把昵称改成 B 的就能翻 B 的号。
  allow_nickname_identity: false
  # 启动 MCP 服务的命令。想固定版本或用本地检出的目录就改这里
  # （比如 ["node", "D:/wuwa/src/mcp/server.js"]）。
  command: ["npx", "-y", "--package", "wuthering-waves-platform",
            "wuthering-waves-platform-mcp"]
  timeout_seconds: 120       # npx 第一次要下包（冷启动实测 12 秒），别给 20
  cache_seconds: 60          # 结果缓存；每次查询要起一个 node 进程
  default_account: ''        # 固定用某个账号 ID（一般留空；账号按人归属）
  max_chars: 1200            # 全角色汇总最多输出多少字


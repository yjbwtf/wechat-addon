# ==========================================================================
#  梗词库
#  ------------------------------------------------------------------------
#  这个文件是给人改的，机器人**只读**它；群里现教的梗写进
#  data/memes_user.yaml，不会污染这里。
#
#  命中逻辑：拿 term 和 alias 去当前消息 + 最近聊天记录里找，
#  命中才会把 note 塞进提示词（不是每次都全量注入，那样反而费 token）。
#
#  note 怎么写最有用：
#    - 一句话说清「这个梗在表达什么情绪」，不要写百科条目；
#    - 结尾带上「怎么接」的倾向（顺着演 / 吐槽一句 / 别科普）；
#    - 越短越省 token，一般 25~45 字就够。
#
#  在群里教新梗（需要是授权昵称）：
#      \\梗 add 词 | 说明
#      \\梗 del 词
#      \\梗 list
# ==========================================================================

memes:

  # ---------------- 你点名要的 ----------------
  - term: 丝瓜汤
    alias: [丝瓜汤文学]
    note: '"你肝火太旺，喝点丝瓜汤吧"。吐槽东亚家长式"为你好"、回避真实情绪。接梗时带点无奈。'

  - term: 回！答！我！
    alias: [回答我, Look in my eyes, 小明剑魔]
    note: '咆哮体质问模板，配历史人物动画。用来消解严肃话题，可以直接跟着吼一句。'

  - term: 秦始皇
    alias: [信我是秦始皇, 打钱]
    note: '早期诈骗短信梗复活，调侃明显不靠谱的说法或自吹。回一句"打钱"式的鄙视就行。'

  - term: 技能五子棋
    alias: [飞沙走石, 竞缘脑]
    note: '《喜人奇妙夜2》外星从的魔性作品，用荒诞"技能"反讽竞技至上。可以随口报一个假技能名。'

  - term: 老登电影
    alias: [老登, 登味]
    note: '吐槽爹味、套路化宏大叙事的影视作品。带点嫌弃地接。'

  - term: 北京孩子
    alias: [爷们儿要脸, 咱是一北京孩子]
    note: '马頔的"咱是一北京孩子""爷们儿要脸"，形容又清高又自嘲的矛盾心态。'

  - term: 洪玄烨
    alias: [清朝野史]
    note: '清朝野史段子，把康熙戏称为洪玄烨。属于反差式解构，别当真考据。'

  - term: 馕言文
    alias: [香得很嘛]
    note: '新疆口音普通话的倒装句式。可以模仿那个语序接一句。'

  - term: 连滚带爬
    alias: [从从容容游刃有余]
    note: '郑智化吐槽机场无障碍设施的用词，现在泛指狼狈。自嘲时用。'

  - term: 法拉利老了还是法拉利
    alias: [法拉利]
    note: '夸年长的人或经典事物状态依然顶级，用来消解衰老焦虑。'

  - term: 那咋了
    note: '万能摆烂式回应，带着"关我什么事"的松弛。可以直接用。'

  - term: 包的
    note: '"保证的"谐音，表示没问题、肯定。爽快答应时用。'

  - term: 偷感
    alias: [偷感很重]
    note: '形容做事畏畏缩缩、像在偷东西的状态。'

  - term: city不city
    alias: [city]
    note: '问洋气不洋气、够不够都市感。回答"city"或"不city"。'

  - term: 已读乱回
    note: '看到了但故意答非所问。可以真的乱回一句。'

  - term: 班味
    note: '上班上的疲惫感和社畜气息。吐槽工作时用。'

  # ---------------- 常青梗 ----------------
  - term: 抽象
    alias: [太抽象了, 搞抽象]
    note: '形容看不懂、离谱、荒诞。可以顺着说"确实抽象"。'

  - term: 破防
    note: '心理防线被击穿、绷不住了。'

  - term: 蚌埠住了
    alias: [绷不住了, 绷不住]
    note: '"绷不住了"谐音，忍不住笑或忍不住崩。'

  - term: yyds
    alias: [永远的神]
    note: '吹捧用的夸张赞美。'

  - term: 绝绝子
    note: '夸张赞美，现在多带点调侃味。'

  - term: 典
    alias: [典中典, 太典了]
    note: '讽刺对方说的话非常典型、毫无新意。'

  - term: 急了
    alias: [你急了, 急孝典]
    note: '嘲讽对方情绪失控。回嘴时用。'

  - term: 小丑竟是我自己
    alias: [小丑]
    note: '自嘲白忙一场、自作多情。'

  - term: 老六
    note: '阴险、爱偷袭、不讲武德的人。'

  - term: 遥遥领先
    note: '反讽式吹捧，源自发布会。常用来阴阳怪气。'

  - term: 我勒个豆
    note: '惊叹，相当于"我的天"。'

  - term: 显眼包
    note: '爱出风头、存在感极强的人，褒贬都有。'

  - term: 搭子
    note: '只做某一件事的轻量伙伴，饭搭子、游戏搭子。'

  - term: 电子榨菜
    note: '吃饭时配着看的视频或剧。'

  - term: 窝囊费
    note: '工资的自嘲说法，拿钱受气。'

  - term: 红温
    note: '气到脸红上头。源自游戏主播。'

  - term: 硬控
    note: '被强行控制住，比如"被这段视频硬控三分钟"。'

  - term: 水灵灵地
    note: '副词梗，"水灵灵地就……"，形容毫不费力或理直气壮地做了某事。'

  - term: 松弛感
    note: '不紧绷、不在乎的从容状态。'

  - term: 尊嘟假嘟
    note: '"真的假的"卖萌版。'

  - term: 栓Q
    note: '"thank you"谐音，多用于无语、无奈。'

  - term: 666
    alias: [6]
    note: '夸厉害，也可反讽。'

  - term: 233
    note: '笑声，等于"哈哈哈"。'

  - term: 退退退
    note: '驱赶、拒绝的意思，源自网络视频。'

  - term: 泰裤辣
    note: '"太酷啦"谐音，夸张赞美。'

  - term: emo
    note: '情绪低落、伤感。'

  - term: 内卷
    note: '无意义的过度竞争。'

  - term: 躺平
    note: '放弃竞争、不再挣扎。'

  - term: 格局
    alias: [格局小了, 打开格局]
    note: '眼界和胸怀。常用来调侃对方想得小。'
